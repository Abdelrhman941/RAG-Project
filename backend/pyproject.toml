[project]
name = "RAG-backend"
version = "0.1.0"
description = "A backend service for RAG (Retrieval-Augmented Generation) applications."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=25.1.0",
    "anyio>=4.14.2",
    "charset-normalizer>=3.4.9",
    "fastapi[standard]>=0.141.1",
    "fastembed>=0.8.0",
    "groq>=1.6.0",
    "langchain-text-splitters>=1.1.2",
    "pydantic-settings>=2.14.2",
    "pypdf>=6.14.2",
    "qdrant-client>=1.18.0",
    "sentence-transformers>=5.6.1",
    "tiktoken>=0.13.0",
]

[dependency-groups]
dev = [
    "faker>=40.36.0",
    "fpdf2>=2.8.7",
    "httpx2>=2.9.1",
    "mypy>=2.3.0",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.0",
    "vulture>=2.16",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["B008"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "Depends",
]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v --tb=short"
asyncio_mode = "auto"

[project]
name = "RAG-backend"
version = "0.1.0"
description = "A backend service for RAG (Retrieval-Augmented Generation) applications."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["fastapi[standard]>=0.141.1", "pydantic-settings>=2.14.2"]

[dependency-groups]
dev = ["mypy>=2.3.0", "pre-commit>=4.6.1", "pytest>=9.1.1", "ruff>=0.16.0"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v --tb=short"

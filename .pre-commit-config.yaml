repos:
  # ---------------------------------------------------------
  # Standard Hooks
  # ---------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml

  # ---------------------------------------------------------
  # Ruff (Backend)
  # ---------------------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.0
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  # ---------------------------------------------------------
  # Local Hooks
  # ---------------------------------------------------------
  - repo: local
    hooks:
      # ---------------- Backend ----------------

      - id: mypy
        name: mypy
        entry: bash -c "cd backend && uv run mypy app"
        language: system
        pass_filenames: false
        files: ^backend/

      # Enable later
      # - id: pytest
      #   name: pytest
      #   entry: bash -c "cd backend && uv run pytest"
      #   language: system
      #   pass_filenames: false
      #   stages: [pre-push]

      # ---------------- Frontend ----------------

      - id: eslint
        name: eslint
        entry: bash -c "cd frontend && pnpm lint"
        language: system
        pass_filenames: false
        files: ^frontend/
